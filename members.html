<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Members ♡ K-POP LYRICS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Poppins:wght@400;500;600;700&display=swap');

*{
  box-sizing:border-box;
}

body{
  margin:0;
  color:#29272b;
  background:#f7f1e7;
  font-family:Poppins,sans-serif;
}

/* paper texture */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background:
    linear-gradient(#cfc7bb 1px,transparent 1px),
    linear-gradient(90deg,#cfc7bb 1px,transparent 1px);
  background-size:30px 30px;
  z-index:-1;
}

/* ================= HEADER ================= */

header{
  width:94%;
  max-width:1200px;
  margin:24px auto;
  padding:17px 20px;
  background:#fffdf8;
  border:2px solid #29272b;
  box-shadow:6px 6px 0 #29272b;
  transform:rotate(-.3deg);
  position:relative;
}

.logo{
  font-family:"Patrick Hand",cursive;
  font-size:30px;
  margin-bottom:10px;
}

header::after{
  content:"♡ K-POP SCRAPBOOK";
  position:absolute;
  right:20px;
  top:-14px;
  background:#f3c7d5;
  border:1px solid #29272b;
  padding:4px 12px;
  font-family:"Patrick Hand",cursive;
  transform:rotate(3deg);
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

nav a{
  text-decoration:none;
  color:#29272b;
  font-size:11px;
  padding:6px 11px;
  border:1.5px solid #29272b;
  box-shadow:2px 2px 0 #29272b;
  background:#dcecf3;
}

nav a:nth-child(2){background:#f4d5df}
nav a:nth-child(3){background:#f5e5aa}
nav a:nth-child(4){background:#dcebdc}
nav a:nth-child(5){background:#e1d8ef}
nav a:nth-child(6){background:#f5dccb}
nav a:nth-child(7){background:#d8e8f1}
nav a:nth-child(8){background:#eadce7}

nav a:hover{
  transform:translateY(-2px) rotate(-1deg);
}

/* ================= MAIN ================= */

main{
  width:94%;
  max-width:1200px;
  margin:35px auto;
}

/* title */

.title-paper{
  background:#fffdf8;
  border:2px solid #29272b;
  box-shadow:7px 7px 0 #29272b;
  padding:27px;
  margin-bottom:28px;
  position:relative;
}

.title-paper::after{
  content:"02";
  position:absolute;
  right:25px;
  bottom:5px;
  font-family:"Patrick Hand",cursive;
  font-size:55px;
  color:#eadfe4;
}

.label{
  font-family:"Patrick Hand",cursive;
  font-size:18px;
  color:#777;
}

h1{
  font-family:"Patrick Hand",cursive;
  font-size:52px;
  margin:0;
}

.title-paper p{
  font-size:13px;
  margin:4px 0 0;
}

/* note */

.note{
  display:inline-block;
  background:#f4e4a9;
  border:1.5px solid #29272b;
  box-shadow:3px 3px 0 #29272b;
  padding:7px 14px;
  font-family:"Patrick Hand",cursive;
  font-size:17px;
  transform:rotate(-1.5deg);
  margin-bottom:28px;
}

/* ================= GROUP ================= */

.group{
  background:#fffdf8;
  border:2px solid #29272b;
  box-shadow:7px 7px 0 #29272b;
  padding:20px;
  margin-bottom:38px;
  position:relative;
}

.group:nth-of-type(even){
  transform:rotate(.15deg);
}

.group:nth-of-type(odd){
  transform:rotate(-.12deg);
}

/* tape */

.group::before{
  content:"";
  position:absolute;
  width:75px;
  height:23px;
  top:-13px;
  left:45px;
  background:#edccd5;
  opacity:.8;
  transform:rotate(-4deg);
  border:1px solid #d4aeb9;
}

/* group heading */

.group-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:17px;
}

.group-number{
  background:#dcebdc;
  border:1.5px solid #29272b;
  padding:5px 11px;
  font-family:"Patrick Hand",cursive;
  font-size:17px;
}

.group-head h2{
  margin:0;
  font-family:"Patrick Hand",cursive;
  font-size:32px;
}

.group-meta{
  font-size:10px;
  color:#777;
}

/* ================= SMALL MEMBER ROWS ================= */

.member-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:13px;
}

.member{
  background:#fff;
  border:1.5px solid #29272b;
  box-shadow:3px 3px 0 #29272b;
  padding:7px;
  cursor:pointer;
  position:relative;
  transition:.2s;
}

.member:nth-child(odd){
  transform:rotate(-1deg);
}

.member:nth-child(even){
  transform:rotate(1deg);
}

.member:hover{
  transform:translateY(-5px) rotate(0);
  box-shadow:5px 6px 0 #29272b;
}

.member img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  border:1px solid #29272b;
}

.member-name{
  font-family:"Patrick Hand",cursive;
  font-size:16px;
  text-align:center;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.member-mini{
  text-align:center;
  color:#777;
  font-size:7px;
  margin-top:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.member::after{
  content:"♡";
  position:absolute;
  right:-6px;
  top:-8px;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4bfd0;
  border:1px solid #29272b;
  font-size:10px;
}

/* ================= POPUP ================= */

#popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(40,37,42,.42);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.info-paper{
  width:min(440px,95%);
  background:#fffdf8;
  border:2px solid #29272b;
  box-shadow:9px 9px 0 #29272b;
  padding:27px;
  position:relative;
  transform:rotate(-1deg);
}

.info-paper::before{
  content:"MEMBER PROFILE ♡";
  position:absolute;
  top:-15px;
  left:25px;
  background:#f4d3dd;
  border:1px solid #29272b;
  padding:4px 12px;
  font-family:"Patrick Hand",cursive;
}

.info-paper h2{
  font-family:"Patrick Hand",cursive;
  font-size:34px;
  margin:3px 0 17px;
}

.info-row{
  background:#f3efe8;
  border:1px solid #c7c0b6;
  padding:8px 10px;
  margin:7px 0;
  font-size:12px;
}

.info-row b{
  font-family:"Patrick Hand",cursive;
  font-size:16px;
}

.close{
  margin-top:12px;
  background:#f4bfd0;
  border:1.5px solid #29272b;
  box-shadow:3px 3px 0 #29272b;
  padding:7px 17px;
  font-family:"Patrick Hand",cursive;
  font-size:17px;
  cursor:pointer;
}

/* ================= FOOTER ================= */

footer{
  width:94%;
  max-width:1200px;
  margin:45px auto 25px;
  background:#fffdf8;
  border:2px solid #29272b;
  box-shadow:5px 5px 0 #29272b;

/* ================= MOBILE ================= */

@media(max-width:950px){
  .member-grid{
    grid-template-columns:repeat(5,1fr);
  }
}

@media(max-width:750px){

@media(max-width:520px){

  section.className = "group";

    <div class="group-head">

      </div>

  `;

    card.className = "member";

    card.innerHTML = `
      <img src="${member[3]}" alt="${member[0]}">
      <div class="member-name">${member[0]}</div>

  });

  container.appendChild(section);

/* =========================
   AGE CALCULATOR
========================= */

function calculateAge(birthday){

  const birth = new Date(birthday);

  const today = new Date();

  let age = today.getFullYear() - birth.getFullYear();

  const monthDifference =
    today.getMonth() - birth.getMonth();

  if(
    monthDifference < 0 ||
    (
      monthDifference === 0 &&
      today.getDate() < birth.getDate()
    )
  ){
    age--;
  }

  return age;
}


/* =========================
   POPUP
========================= */

function showPopup(name,group,birthday,position,debut){

  document.getElementById("popupName").textContent = name;
  document.getElementById("popupGroup").textContent = group;
  document.getElementById("popupBirthday").textContent = birthday;
  document.getElementById("popupPosition").textContent = position;
  document.getElementById("popupDebut").textContent = debut;

  const age = calculateAge(birthday);

  document.getElementById("popupAge").textContent =
    age + " years old";

  document.getElementById("popup").style.display = "flex";
}


function closePopup(){

  document.getElementById("popup").style.display = "none";

}


document.getElementById("popup").addEventListener("click",function(event){

  if(event.target === this){
    closePopup();
  }

});


document.addEventListener("keydown",function(event){

  if(event.key === "Escape"){
    closePopup();
